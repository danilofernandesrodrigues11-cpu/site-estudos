<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estuda</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        linear-gradient(110deg, rgba(10,23,45,.88), rgba(10,23,45,.45)),
        url("https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1600&q=85")
        center / cover no-repeat fixed;
    }

    main {
      width: min(100%, 420px);
      padding: 34px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 20px;
      background: rgba(15,29,49,.88);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 22px;
      font-size: 30px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input, button {
      width: 100%;
      min-height: 50px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      border: 1px solid rgba(255,255,255,.25);
      padding: 0 14px;
      outline: none;
      background: rgba(255,255,255,.08);
      color: #fff;
    }

    input::placeholder { color: #b7c4d2; }
    input:focus {
      border-color: #88d5b3;
      box-shadow: 0 0 0 3px rgba(136,213,179,.15);
    }

    button {
      margin-top: 20px;
      border: 0;
      background: #88d5b3;
      color: #102b30;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      cursor: wait;
      opacity: .65;
    }

    #painel { display: none; }

    #mensagem {
      min-height: 22px;
      margin: 14px 0 0;
      color: #ffdb9c;
      text-align: center;
    }

    @media (max-width: 480px) {
      body { padding: 14px; background-attachment: scroll; }
      main { padding: 26px 22px; }
    }
  </style>
</head>

<body>
  <main>
    <section id="login">
      <h1>Bem-vindo(a)</h1>

      <form id="form-login">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          placeholder="seuemail@exemplo.com"
          autocomplete="email"
          required
        >

        <label for="senha">Senha</label>
        <input
          id="senha"
          type="password"
          placeholder="Sua senha"
          autocomplete="current-password"
          required
        >

        <button id="botao-entrar" type="submit">Entrar</button>
      </form>

      <p id="mensagem" role="status"></p>
    </section>

    <section id="painel">
      <h1>Meu painel</h1>
      <p id="boas-vindas"></p>
      <button id="botao-sair" type="button">Sair</button>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://lfimtfrtixvkbhkoicbo.supabase.co";
    const SUPABASE_KEY = "sb_publishable_O979DqNhfXBE4G5oSPlJ1A_cq8HYgwu";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const secaoLogin = document.getElementById("login");
    const secaoPainel = document.getElementById("painel");
    const formulario = document.getElementById("form-login");
    const campoEmail = document.getElementById("email");
    const campoSenha = document.getElementById("senha");
    const botaoEntrar = document.getElementById("botao-entrar");
    const botaoSair = document.getElementById("botao-sair");
    const mensagem = document.getElementById("mensagem");
    const boasVindas = document.getElementById("boas-vindas");

    function mostrarPainel(usuario) {
      secaoLogin.style.display = "none";
      secaoPainel.style.display = "block";
      boasVindas.textContent = "Olá, " + (usuario.email || "estudante");
    }

    function mostrarLogin() {
      secaoPainel.style.display = "none";
      secaoLogin.style.display = "block";
    }

    async function verificarSessao() {
      const { data, error } = await client.auth.getSession();

      if (error) {
        mensagem.textContent = "Não foi possível verificar sua sessão.";
        return;
      }

      if (data.session) {
        mostrarPainel(data.session.user);
      } else {
        mostrarLogin();
      }
    }

    formulario.addEventListener("submit", async (event) => {
      event.preventDefault();
      mensagem.textContent = "";
      botaoEntrar.disabled = true;
      botaoEntrar.textContent = "Entrando...";

      const email = campoEmail.value.trim();
      const senha = campoSenha.value;

      const { data, error } = await client.auth.signInWithPassword({
        email,
        password: senha
      });

      botaoEntrar.disabled = false;
      botaoEntrar.textContent = "Entrar";

      if (error) {
        mensagem.textContent = "Email ou senha incorretos.";
        return;
      }

      if (data.user) {
        campoSenha.value = "";
        mostrarPainel(data.user);
      }
    });

    botaoSair.addEventListener("click", async () => {
      await client.auth.signOut();
      mostrarLogin();
    });

    verificarSessao();
  </script>
</body>
</html>
