<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estuda — Entrar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        linear-gradient(110deg, rgba(10, 23, 45, .88), rgba(10, 23, 45, .38)),
        url("https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=2000&q=85")
        center / cover no-repeat fixed;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: min(100%, 430px);
      padding: 42px;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 22px;
      background: rgba(15, 29, 49, .78);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .brand-icon {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 13px;
      background: #88d5b3;
      color: #102b30;
      font-size: 22px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 7vw, 36px);
    }

    .intro {
      margin: 0 0 28px;
      color: #d3deea;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      min-height: 50px;
      padding: 0 15px;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 11px;
      outline: none;
      background: rgba(255, 255, 255, .09);
      color: #fff;
      font-size: 16px;
    }

    input::placeholder {
      color: #b7c4d2;
    }

    input:focus {
      border-color: #88d5b3;
      box-shadow: 0 0 0 3px rgba(136, 213, 179, .18);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 75px;
    }

    .show-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #bfe9d6;
      cursor: pointer;
      font-size: 13px;
    }

    .submit-button {
      width: 100%;
      min-height: 52px;
      margin-top: 26px;
      border: 0;
      border-radius: 11px;
      background: #88d5b3;
      color: #102b30;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      transition: background .2s, transform .2s;
    }

    .submit-button:hover {
      transform: translateY(-1px);
      background: #a0e6c6;
    }

    .message {
      min-height: 22px;
      margin: 14px 0 0;
      color: #ffdb9c;
      font-size: 14px;
      text-align: center;
    }

    .footer {
      margin: 25px 0 0;
      color: #c1ccda;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
        background-attachment: scroll;
      }

      .login-card {
        padding: 30px 24px;
      }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">✦</span>
      <span>Estuda</span>
    </div>

    <h1>Boas-vindas!</h1>
    <p class="intro">Entre na sua conta e continue de onde parou nos estudos.</p>

    <form id="login-form">
      <label for="usuario">Usuário</label>
      <input
        id="usuario"
        name="usuario"
        type="text"
        placeholder="Digite seu usuário"
        autocomplete="username"
        required
      >

      <label for="senha">Senha</label>
      <div class="password-wrap">
        <input
          id="senha"
          name="senha"
          type="password"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        >
        <button class="show-password" id="toggle-password" type="button">
          Mostrar
        </button>
      </div>

      <button class="submit-button" type="submit">Entrar</button>
      <p class="message" id="message" role="status"></p>
    </form>

    <p class="footer">Seu espaço para aprender, no seu ritmo.</p>
  </main>

  <script>
    const passwordInput = document.getElementById("senha");
    const toggleButton = document.getElementById("toggle-password");
    const form = document.getElementById("login-form");
    const message = document.getElementById("message");

    toggleButton.addEventListener("click", () => {
      const showing = passwordInput.type === "text";
      passwordInput.type = showing ? "password" : "text";
      toggleButton.textContent = showing ? "Mostrar" : "Ocultar";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      message.textContent =
        "A tela está pronta. O acesso ainda precisa ser conectado a um sistema seguro.";
    });
  </script>
</body>
</html>
